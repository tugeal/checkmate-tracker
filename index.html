<style>

td.ac{white-space:nowrap}td.ac .btn{margin-right:6px}
form{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px;background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--sh);padding:18px;margin-bottom:14px}
label{display:grid;gap:5px;font-size:13px;font-weight:600;color:var(--ink2)}
.empty{padding:36px;text-align:center;color:var(--mut);border:1px dashed var(--line2);border-radius:14px;background:var(--card)}.empty::before{content:"♟";display:block;font-size:30px;opacity:.35;margin-bottom:4px}
dialog{border:0;border-radius:18px;padding:0;width:min(600px,calc(100vw - 32px));max-height:calc(100vh - 32px);max-height:calc(100dvh - 32px);overflow:auto;background:#fff;color:var(--ink);box-shadow:var(--sh2)}

.di{padding:24px}.dh{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;margin-bottom:16px}.dh h3,h3{margin:0;font:700 20px/1.3 var(--hf);letter-spacing:-.02em}.dh .meta{white-space:normal;margin-top:4px}
textarea{width:100%;background:#fff;line-height:1.55;border:1px solid var(--line2);border-radius:12px;padding:12px 14px;resize:vertical;margin-top:6px;min-height:210px}
.df{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px;align-items:center}.df .btn{height:40px}.df .rst{margin-left:auto}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translate(-50%,16px);background:var(--ink);color:#fff;padding:11px 18px;border-radius:12px;font-weight:600;box-shadow:var(--sh2);opacity:0;transition:opacity .2s,transform .2s;pointer-events:none;z-index:20;max-width:90vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}#toast.on{opacity:1;transform:translate(-50%,0)}
@media(prefers-reduced-motion:reduce){.fl{animation:none}.btn,#toast,.tabs button{transition:none}}
@media(pointer:coarse){.btn{min-height:40px}.btn.sm{height:40px}input,select{height:44px}}
@media(min-width:641px) and (min-height:620px){
html,body{height:100%}body{overflow:hidden}
.wrap{height:100vh;height:100dvh;display:flex;flex-direction:column;padding-top:16px;padding-bottom:16px}
.wrap>div{flex:none}.stats{margin:12px 0}.ph{margin:14px 0 10px}

#main>.ph,#main>.tb,#main>form,#main>.empty,#main>.pg{flex:none}
#main>.list{flex:0 1 auto;min-height:0;overflow:auto}
#tbl{flex:1 1 auto;min-height:0;display:flex;flex-direction:column}#tbl .tw{flex:0 1 auto;min-height:0}#tbl .pg{flex:none}#lg{flex:1 1 auto;min-height:0;display:flex;flex-direction:column}#lg .list{flex:0 1 auto;min-height:0;overflow:auto}#lg .pg{flex:none}}
@media(max-width:640px){
.wrap{padding:14px 14px 40px}.top{padding:14px 16px}.top>div:first-child{padding-left:54px}.top>div:first-child::before{width:40px;height:40px;font-size:22px}
h1{font-size:24px}.sub{font-size:13px}.clock{text-align:left}.clock b{font-size:20px}
.stats{grid-template-columns:1fr 1fr;gap:10px}.stats .st:last-child{grid-column:1/-1}.st{padding:12px 14px}.st b{font-size:24px}
input,select,textarea{font-size:16px}.tb input{max-width:none;flex:1 1 100%}.tb select,.tb .btn{flex:1 1 140px}.tb .sp{display:none}
.row,.row.re{grid-template-columns:1fr;gap:8px;padding:14px 16px 14px 24px}.row>.acts{justify-content:stretch}.row>.acts .btn{width:100%}
.df .btn{flex:1 1 130px}.df .rst{flex:1 1 100%;margin-left:0}
.tw{border:0;box-shadow:none;background:none;overflow:visible}
table,tbody,tr,td{display:block}table{min-width:0;table-layout:auto}tr:first-child{display:none}
tr{background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--sh);padding:8px 16px;margin-bottom:10px}tr:hover td{background:none}
td,td.nm{display:flex;justify-content:space-between;align-items:center;gap:12px;border:0;padding:5px 0;white-space:normal;text-align:right}
td::before{content:attr(data-l);color:var(--mut);font-size:12px;font-weight:600;text-align:left;flex:none}td.ac{justify-content:flex-start;padding-top:10px}td.ac::before{content:none}
.pg{justify-content:center}
dialog{margin:auto auto 0;width:100%;max-width:none;border-radius:20px 20px 0 0}.di{padding:20px 18px 24px}}
@media(max-width:520px){.tabs button{flex:1 1 100%;text-align:left}}
#gate{position:fixed;inset:0;z-index:50;background:var(--bg);display:grid;place-items:center;padding:20px}body.in #gate{display:none}body:not(.in) .wrap{visibility:hidden}
.gc{background:#fff;border:1px solid var(--line);border-radius:18px;box-shadow:var(--sh2);padding:28px;width:min(420px,100%)}.gc h2{font:800 22px var(--hf);margin:14px 0 4px;letter-spacing:-.02em}.gc p{color:var(--mut);margin:0 0 16px}
.gc .gb{width:46px;height:46px;border-radius:13px;background:var(--ink);color:#fff;display:grid;place-items:center;font-size:25px}#gm{margin:12px 0 0;min-height:20px;font-weight:600;color:var(--ink2)}
.top .rt{display:flex;gap:14px;align-items:center}@media(max-width:640px){.top .rt{width:100%;justify-content:space-between}}
</style></head><body><div id="gate"><form class="gc" id="gf"><div class="gb">♟</div><h2>Checkmate Cafe Tracker</h2><p>Sign in with your agent email. We will send you a one-time sign-in link.</p><label>Email address<input id="ge" type="email" required autocomplete="email" placeholder="you@example.com"></label><button class="btn pri" id="gb" style="width:100%;margin-top:12px">Send sign-in link</button><p id="gm" role="status"></p></form></div><div class="wrap">
<div class="top"><div><h1>Checkmate Cafe Tracker</h1><div class="sub">Chess session bookings, reminders and attendance.</div></div>
<div class="rt"><div class="clock" id="clk" aria-label="Current date and time"></div><button class="btn sm" id="so">Sign out</button></div></div>
<div class="stats" id="stats"></div><div class="tabs" id="tabs"></div><main id="main"></main></div><div id="toast" role="status" aria-live="polite"></div>
<dialog id="dlg" aria-labelledby="mt"><div class="di"><div class="dh"><div><h3 id="mt"></h3><div class="meta" id="ms"></div></div><button class="btn sm" onclick="$('dlg').close()">Close</button></div>
<label>Message (you can edit it before copying)<textarea id="mx" rows="10"></textarea></label>
<div class="df"><button class="btn pri" id="mc" onclick="cpT()">Copy message</button><a class="btn" id="mo" target="_blank" rel="noopener">Open chat</a><button class="btn" id="mk" onclick="mk()"></button><button class="btn sm rst" onclick="$('mx').value=cur.msg">Reset message</button></div><div class="meta" id="mn" style="display:none;margin-top:10px;white-space:normal">No chat link saved for this client yet. Add one in Student Records using Edit.</div></div></dialog>
<dialog id="cdlg" aria-labelledby="ct"><div class="di"><h3 id="ct" style="margin:0 0 8px;font-size:18px">Delete this record?</h3><p id="cm" style="margin:0 0 16px;color:var(--mut)"></p><div class="df" style="margin:0;justify-content:flex-end"><button class="btn" onclick="$('cdlg').close()">Cancel</button><button class="btn no" onclick="dl1()">Delete record</button></div></div></dialog>
<script>
const $=id=>document.getElementById(id),P=n=>String(n).padStart(2,"0"),iso=d=>d.getFullYear()+"-"+P(d.getMonth()+1)+"-"+P(d.getDate()),mn=t=>+t.slice(0,2)*60+ +t.slice(3,5);
const fm=m=>{const h=Math.floor(m/60);return(h%12||12)+":"+P(m%60)+" "+(h<12?"AM":"PM")};
const NAME={gb:"Group Beginner",gi:"Group Intermediate",oo:"1-on-1",fc:"Face-to-Face Clinic"};
const TOT={gb:10,gi:10,oo:3,fc:8},PR={gb:[1000,200],gi:[1500,250],oo:[1200,500],fc:[3000,500]};
const SL={gb:[[1,"17:30","18:10"],[6,"16:30","17:10"],[0,"11:00","11:40"]],gi:[[3,"17:30","18:10"],[6,"17:30","18:10"],[0,"12:00","12:40"]],fc:[[6,"14:00","16:00"],[0,"14:00","16:00"]]};

const E=t=>String(t).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const chat=s=>s.link?`<a class="btn sm" href="${E(s.link)}" target="_blank" rel="noopener">Open chat</a>`:"";

const sb=(window.CFG&&CFG.url&&CFG.url.startsWith("https://")&&!CFG.url.includes("YOUR"))?supabase.createClient(CFG.url,CFG.key):null;
let D={n:0,rem:{},att:{},msg:{},st:[]};
const fromRow=r=>({id:r.id,client:r.client,name:r.name,kind:r.kind,total:r.total,done:r.done,last:r.last_attended||"",start:r.start_date||"",agent:r.agent||"",price:Number(r.price),link:r.link||"",dates:r.dates||[]});
const toRow=s=>({client:s.client,name:s.name,kind:s.kind,total:s.total,done:s.done,last_attended:s.last||null,start_date:s.start||null,agent:s.agent||"",price:s.price||0,link:s.link||"",dates:s.dates||[]});
async function load(){const[a,b,c]=await Promise.all([sb.from("students").select("*").order("id"),sb.from("flags").select("*"),sb.from("settings").select("*")]);
if(a.error||b.error){toast("Could not load data. Please check your connection.");return false}
D.st=a.data.map(fromRow);D.rem={};D.att={};D.msg={};b.data.forEach(f=>{D[f.kind][f.key]=f.kind=="att"?f.value:true});
(c.data||[]).forEach(r=>{if(r.key=="zoom")ZOOM=r.value;if(r.key=="cafe")CAFE=r.value});return true}
const dbErr=async r=>{if(r&&r.error){toast("Could not save. Please try again.");console.error(r.error);await load();render()}return !(r&&r.error)};
const setFlag=(kind,key,on,val)=>(on?sb.from("flags").upsert({kind,key:String(key),value:val||"1"}):sb.from("flags").delete().eq("kind",kind).eq("key",String(key))).then(dbErr);
const saveStudent=s=>sb.from("students").update({done:s.done,last_attended:s.last||null}).eq("id",s.id).then(dbErr);
const save=()=>{};
const now=new Date(),PER=10;let tab="today",simD=iso(now),simT=P(now.getHours())+":"+P(now.getMinutes()),pg={today:1,stu:1,re:1,log:1},q="",ft="",showAdd=false;
const grp=s=>s.kind=="gb"||s.kind=="gi",fin=s=>s.done>=s.total;
const exp=s=>{if(!grp(s)||!s.start)return null;const d=new Date(s.start+"T00:00");d.setMonth(d.getMonth()+2);return iso(d)};
const ex=(s,ds)=>{const e=exp(s);return e&&ds>e};
function sess(ds,tom){const wd=new Date(ds+"T00:00").getDay(),o=[];
D.st.forEach(s=>{if(fin(s))return;
if(s.kind=="oo")(s.dates||[]).forEach(x=>{if(x.slice(0,10)==ds){const a=mn(x.slice(11,16));o.push({s,ds,a,b:a+60,tom})}});
else(SL[s.kind]||[]).forEach(([w,a,b])=>{if(w==wd)o.push({s,ds,a:mn(a),b:mn(b),tom})})});
return o.sort((x,y)=>x.a-y.a)}
const key=z=>z.ds+"|"+z.s.id+"|"+z.a;
function today(){return sess(simD,0).filter(z=>!ex(z.s,z.ds))}
function stats(){const nm=mn(simT),l=today();
const v=[[l.length,"Sessions"],[new Set(l.filter(z=>!ex(z.s,z.ds)&&!D.rem[key(z)]).map(z=>z.s.client+z.a)).size,"Reminders to send"],[l.filter(z=>!z.tom&&z.b<=nm&&!ex(z.s,z.ds)&&!D.att[key(z)]).length,"Attendance to confirm"],[D.st.filter(s=>fin(s)&&!D.msg[s.id]).length,"To re-enroll"],[D.st.filter(s=>!fin(s)&&exp(s)&&simD>exp(s)).length,"Expired packages",1]];
$("stats").innerHTML=v.map((x,i)=>`<${x[2]?`button class="st ${x[0]?"warn":""}" onclick="seeExp()"`:`div class="st"`}><b class="${prevS[i]!==undefined&&prevS[i]!==x[0]?"fl":""}">${x[0]}</b><span>${x[1]}</span></${x[2]?"button":"div"}>`).join("");prevS=v.map(x=>x[0])}
const kt=s=>`<span class="tag k-${s.kind}">${NAME[s.kind]}</span>`;
const prog=s=>`<span class="bar"><i style="width:${Math.min(100,s.done/s.total*100)}%"></i></span>${s.done}/${s.total}`;
function pager(n,t,lb){const pages=Math.max(1,Math.ceil(t/PER)),p=Math.min(pg[n],pages);pg[n]=p;
return[`<div class="pg"><span>Showing ${t?(p-1)*PER+1:0}–${Math.min(t,p*PER)} of ${t} ${lb[t==1?0:1]}</span><div><button class="btn sm" onclick="go('${n}',-1)" ${p<=1?"disabled":""}>Previous</button><span>Page ${p} of ${pages}</span><button class="btn sm" onclick="go('${n}',1)" ${p>=pages?"disabled":""}>Next</button></div></div>`,(p-1)*PER]}
